[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.0.2",
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "groq>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.12.2",
    "qdrant-client>=1.18.0",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.48.0",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]
# ignore = ["E999", "F401", "I001"]  # E999 = invalid syntax

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

dependencies = [
    "anthropic>=0.104.1",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]
